appId: com.example.electronvitetemplate
productName: Electron Vite Template
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
publish:
  provider: github
  owner: replace-with-your-github-name
  repo: replace-with-your-repository
mac:
  category: public.app-category.utilities
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
portable:
  artifactName: ${productName}-${version}-portable.${ext}
linux:
  category: Utility
  target:
    - AppImage
