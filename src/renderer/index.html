<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>Electron Vite Template</title>
    <script>
      try {
        const theme = localStorage.getItem('electron-template-theme')
        const dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute('content', dark ? '#0f172a' : '#f4f7fb')
      } catch (_) {
        // The light skeleton remains usable when storage is unavailable.
      }
    </script>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f4f7fb;
      }
      #boot-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 900px;
        min-height: 620px;
        color: #172033;
        background: #f4f7fb;
      }
      .boot-card {
        width: min(520px, 72vw);
        padding: 28px 30px;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        background: #fff;
        box-shadow: 0 18px 45px rgba(37, 99, 235, 0.09);
      }
      .boot-brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .boot-logo {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        border-radius: 11px;
        box-shadow: 0 6px 14px rgba(22, 119, 255, 0.2);
      }
      .boot-title {
        font-size: 20px;
        font-weight: 650;
      }
      .boot-status {
        margin-top: 6px;
        color: #8492a6;
        font-size: 13px;
      }
      .boot-line {
        height: 10px;
        margin-top: 24px;
        border-radius: 999px;
        background: linear-gradient(90deg, #edf2f7 20%, #dbeafe 45%, #edf2f7 70%);
        background-size: 220% 100%;
        animation: shimmer 1.45s ease-in-out infinite;
      }
      .boot-line.short {
        width: 62%;
        margin-top: 12px;
      }
      .boot-progress {
        position: relative;
        height: 4px;
        margin-top: 24px;
        overflow: hidden;
        border-radius: 999px;
        background: #eaf0f7;
      }
      .boot-progress::after {
        position: absolute;
        inset: 0 auto 0 -35%;
        width: 35%;
        border-radius: inherit;
        background: #1677ff;
        content: '';
        animation: progress 1.2s ease-in-out infinite;
      }
      @keyframes shimmer {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -100% 0;
        }
      }
      @keyframes progress {
        from {
          left: -35%;
        }
        to {
          left: 100%;
        }
      }
      html[data-theme='dark'] {
        color-scheme: dark;
        background: #0f172a;
      }
      html[data-theme='dark'] body,
      html[data-theme='dark'] #boot-loader {
        background: #0f172a;
      }
      html[data-theme='dark'] #boot-loader {
        color: #e5edf7;
      }
      html[data-theme='dark'] .boot-card {
        border-color: #2d3a50;
        background: #172033;
        box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
      }
      html[data-theme='dark'] .boot-status {
        color: #94a3b8;
      }
      html[data-theme='dark'] .boot-line {
        background: linear-gradient(90deg, #263244 20%, #334155 45%, #263244 70%);
        background-size: 220% 100%;
      }
      html[data-theme='dark'] .boot-progress {
        background: #263244;
      }
    </style>
  </head>
  <body>
    <div id="boot-loader" aria-label="正在加载桌面应用模板">
      <div class="boot-card">
        <div class="boot-brand">
          <svg class="boot-logo" viewBox="0 0 40 40" aria-hidden="true">
            <rect width="40" height="40" rx="11" fill="#1677ff" />
            <path
              d="M10 12h20v17H10zM10 18h20M18 18v11"
              fill="none"
              stroke="#fff"
              stroke-width="2.4"
            />
          </svg>
          <div>
            <div class="boot-title">桌面应用模板</div>
            <div id="boot-status" class="boot-status">正在准备应用界面…</div>
          </div>
        </div>
        <div class="boot-line"></div>
        <div class="boot-line short"></div>
        <div class="boot-progress"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
